name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_BASE_PATH: /aura-vision/
          # Vercel deployment base (e.g. https://aura-vision.vercel.app).
          # Set it as a repository variable to enable server-side activation;
          # leave it empty to fall back to local activation checks.
          VITE_API_BASE: ${{ vars.VERCEL_API_BASE }}
        run: npm run build

      - name: Add SPA fallback (404 -> index.html)
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true

      # Post-deploy smoke against the live site: exercises the real activation
      # chain (browser → GitHub Pages UI → Vercel API). Runs after deploy so a
      # Vercel hiccup can't block shipping, but still fails the run visibly.
      - name: Wait for Pages CDN to serve this build
        run: |
          expected=$(ls dist/assets | grep '^index-.*\.js$' | head -1)
          for i in $(seq 1 30); do
            if curl -fs "https://mocas-12.github.io/aura-vision/" | grep -q "$expected"; then
              echo "CDN serves $expected"
              exit 0
            fi
            sleep 10
          done
          echo "CDN did not serve $expected within 5 minutes"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (production)
        env:
          E2E_BASE_URL: https://mocas-12.github.io
        run: npx playwright test
